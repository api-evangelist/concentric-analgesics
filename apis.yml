aid: concentric-analgesics
name: Concentric Analgesics
description: 'Concentric Analgesics, Inc. is a San Francisco based clinical-stage biopharmaceutical
  company developing non-opioid pain therapeutics. Its lead candidate, vocacapsaicin (CA-008),
  is a first-in-class prodrug that converts to capsaicin, a TRPV1 agonist that selectively
  desensitizes pain-conducting nerve fibers without sensory numbness or motor weakness, given
  as a single local injection during surgery. The program holds FDA Fast Track designation
  (2017) and Breakthrough Therapy designation (2018), and has been evaluated in Phase 2 trials
  in bunionectomy, total knee arthroplasty and open ventral hernia repair. The company is a
  drug developer, not a software vendor: it publishes no API, SDK, developer portal or other
  machine-readable surface, and as of this check its corporate website is an expired Squarespace
  account that returns HTTP 404 for every path.'
